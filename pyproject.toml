[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genresense"
version = "0.1.0"
description = "Spotify library auditing and recommendation pipeline with Flask, dlt, and scikit-learn."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dlt[postgres]>=1.0.0",
    "flask>=3.0.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "spotipy>=2.25.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
